name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # 한글 글꼴 (무료 OFL) — Google Fonts 저장소에서 받아 앱에 넣는다
      - name: Download fonts
        run: |
          set -e
          D=app/src/main/assets/fonts
          mkdir -p $D
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL --retry 3 -o $D/gothic.ttf "$B/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          curl -fsSL --retry 3 -o $D/serif-400.ttf "$B/nanummyeongjo/NanumMyeongjo-Regular.ttf"
          curl -fsSL --retry 3 -o $D/serif-700.ttf "$B/nanummyeongjo/NanumMyeongjo-Bold.ttf"
          curl -fsSL --retry 3 -o $D/serif-800.ttf "$B/nanummyeongjo/NanumMyeongjo-ExtraBold.ttf"
          curl -fsSL --retry 3 -o $D/OFL-NotoSansKR.txt "$B/notosanskr/OFL.txt"
          curl -fsSL --retry 3 -o $D/OFL-NanumMyeongjo.txt "$B/nanummyeongjo/OFL.txt"
          echo "::notice title=fonts::$(ls -la $D | awk 'NR>1{printf "%s %s | ", $9, $5}')"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
        # 빌드가 실패하면 오류 줄만 골라 요약 표시(annotation)로 남긴다 — 채팅에서 원인을 바로 볼 수 있게
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE|Unresolved|Exception" build.log | head -60 > errors.txt || true
          msg=$(sed 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=build-errors::${msg}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ebook-reader.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ebook-reader.apk \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "커밋: ${{ github.sha }} — 폰에서 ebook-reader.apk를 눌러 받아 설치하세요." \
            --target ${{ github.sha }}
